<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lichočár: Digitální Prototyp Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #1a1e24;
            --panel-bg: #2a303c;
            --accent-color: #e74c3c;
            --text-color: #ecf0f1;
            --card-w: 70px;
            --card-h: 100px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-top: 0; color: #f1c40f; font-size: 1.5rem; }
        .hidden { display: none !important; }
        
        #lobby-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #555;
            background: #111; color: white; box-sizing: border-box;
        }
        .slot-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }

        #game-board {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 15px;
            margin-bottom: 20px;
        }

        .player-panel {
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 10px;
            border: 2px solid transparent;
        }
        .player-panel.active { border-color: #f39c12; }
        .player-title { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        
        #p1 { grid-area: 1 / 2 / 2 / 3; text-align: center; } 
        #p2 { grid-area: 2 / 1 / 3 / 2; } 
        #p3 { grid-area: 2 / 3 / 3 / 4; } 
        #p0 { grid-area: 3 / 1 / 4 / 4; background: #34495e; } 

        #center-bank {
            grid-area: 2 / 2 / 3 / 3;
            background: #111418;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #555;
            min-height: 140px;
        }

        .card-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
        .card {
            width: var(--card-w);
            height: var(--card-h);
            border-radius: 6px;
            background: white;
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            box-sizing: border-box;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
        }
        .card:hover:not(.disabled) { transform: translateY(-5px); }
        .card.disabled { opacity: 0.3; cursor: not-allowed; }
        .card.selected { border: 3px solid #f1c40f !important; transform: translateY(-8px); }
        .card.highlighted { box-shadow: 0 0 12px 3px #f39c12; border-color: #f39c12 !important; }
        
        .card.back {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            color: transparent;
            border: 2px solid #fff;
        }

        .card.valid-set { box-shadow: 0 0 10px 3px #2ecc71; border-color: #2ecc71 !important; }
        .card.invalid-set { opacity: 0.7; }

        .drop-slot {
            width: 12px;
            height: var(--card-h);
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .drop-slot.drag-over {
            background: rgba(46, 204, 113, 0.5);
            width: 25px;
        }

        .card.red { color: #e74c3c; border: 2px solid #e74c3c; }
        .card.blue { color: #2980b9; border: 2px solid #2980b9; }
        .card.green { color: #27ae60; border: 2px solid #27ae60; }
        .card.yellow { color: #f39c12; border: 2px solid #f39c12; }
        .card.lichocar { 
            background: #8e44ad; 
            border: 2px solid #9b59b6; 
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .sets-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; font-size: 0.8rem; }
        .set-group { background: rgba(0,0,0,0.3); padding: 5px 8px; border-radius: 4px; border: 1px solid #555; }

        #controls { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #27ae60;
            color: white;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { background: #2ecc71; }
        button:disabled {
            background: #2a303c !important;
            color: #7f8c8d !important;
            border: 1px solid #444 !important;
            opacity: 0.35 !important;
            cursor: not-allowed !important;
        }
        button.danger { background: #c0392b; }
        button.action { background: #e67e22; }

        #log-box {
            width: 100%;
            max-width: 950px;
            height: 130px;
            background: #111;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #2ecc71;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>😈 LICHOČÁR - DIGITÁLNÍ PROTOTYP ONLINE</h1>

    <div id="lobby-container">
        <h2>Připojit se ke hře</h2>
        <div class="form-group">
            <label>Kód místnosti:</label>
            <input type="text" id="room-code" value="stul-1">
        </div>
        <div class="form-group">
            <label>Vaše Jméno / Titul:</label>
            <input type="text" id="player-name" value="Lord">
        </div>
        <div class="form-group">
            <label>Počet hráčů u stolu:</label>
            <select id="total-players" onchange="renderPlayerSetup()">
                <option value="2">2 Hráči</option>
                <option value="3">3 Hráči</option>
                <option value="4" selected>4 Hráči</option>
            </select>
        </div>
        <div id="player-slots-setup"></div>
        <button onclick="joinGame()" style="width: 100%; margin-top: 10px;">Vstoupit do místnosti</button>
    </div>

    <div id="game-board" class="hidden">
        <div class="player-panel" id="p1">
            <div class="player-title" id="p1-title">Hráč 1</div>
            <div class="card-count">Karet v ruce: <span id="p1-count">0</span></div>
            <div class="sets-container" id="p1-sets"></div>
        </div>

        <div class="player-panel" id="p2">
            <div class="player-title" id="p2-title">Hráč 2</div>
            <div class="card-count">Karet v ruce: <span id="p2-count">0</span></div>
            <div class="sets-container" id="p2-sets"></div>
        </div>

        <div id="center-bank">
            <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px;">STŘEDOVÝ BANK / NABÍDKA</div>
            <div id="bank-cards" class="card-list" ondragover="event.preventDefault()"></div>
            <div id="bank-status" style="margin-top: 8px; font-weight: bold; font-size: 0.9rem; text-align: center;"></div>
        </div>

        <div class="player-panel" id="p3">
            <div class="player-title" id="p3-title">Hráč 3</div>
            <div class="card-count">Karet v ruce: <span id="p3-count">0</span></div>
            <div class="sets-container" id="p3-sets"></div>
        </div>

        <div class="player-panel" id="p0">
            <div class="player-title" id="p0-title" style="color: #f1c40f;">VY</div>
            <div>Vyložené sady: <div id="p0-sets" class="sets-container"></div></div>
            <div style="margin-top: 10px;">Vaše ruka:</div>
            <div class="card-list" id="p0-hand"></div>
            
            <div id="controls">
                <button id="btn-accept" disabled>Přijímám nabídku</button>
                <button id="btn-more" disabled>Chci ještě!</button>
                <button id="btn-reject" class="danger" disabled>Odmítám!</button>
                <button id="btn-finish-lay" class="action" disabled>Ukončit přikládání / tah</button>
            </div>
        </div>
    </div>

    <div id="log-box" class="hidden"></div>

    <script>
        const socket = io();
        const SUIT_ICONS = { red: '♥', blue: '♦', green: '♣', yellow: '♠' };

        let mySlotId = null;
        let localState = null;
        let selectedCardIndex = null;
        let draggedSource = null;

        function renderPlayerSetup() {
            const count = parseInt(document.getElementById('total-players').value);
            const container = document.getElementById('player-slots-setup');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'slot-row';
                div.innerHTML = `
                    <label>Pozice ${i + 1} ${i === 0 ? '(Zakladatel)' : ''}:</label>
                    <select id="p-type-${i}">
                        <option value="human">Živý hráč</option>
                        <option value="bot" ${i > 0 ? 'selected' : ''}>Bot</option>
                    </select>
                `;
                container.appendChild(div);
            }
        }
        renderPlayerSetup();

        function joinGame() {
            const roomCode = document.getElementById('room-code').value.trim();
            const playerName = document.getElementById('player-name').value.trim();
            const count = parseInt(document.getElementById('total-players').value);

            const slotConfigs = [];
            for (let i = 0; i < 4; i++) {
                if (i < count) {
                    const isBot = document.getElementById(`p-type-${i}`).value === 'bot';
                    slotConfigs.push({ isBot, active: true });
                } else {
                    slotConfigs.push({ isBot: true, active: false });
                }
            }

            socket.emit('joinRoom', { roomCode, playerName, slotConfigs });
        }

        socket.on('errorMsg', (msg) => alert(msg));

        socket.on('gameStateUpdate', (data) => {
            mySlotId = data.mySlotId;
            localState = data;

            document.getElementById('lobby-container').classList.add('hidden');
            document.getElementById('game-board').classList.remove('hidden');
            document.getElementById('log-box').classList.remove('hidden');

            render();
        });

        function selectCard(idx) {
            const gs = localState.gameState;
            if (!gs) return;

            if (gs.phase === 'CHOOSE_CARD_AND_OFFERER' && gs.activePlayer === mySlotId) {
                selectedCardIndex = idx;
                render();
            } else if (gs.phase === 'LAYING_CARDS' && gs.layContext.playerId === mySlotId) {
                socket.emit('attachCard', { handIndex: idx, targetSlotIndex: null });
            }
        }

        function chooseOfferer(targetSlot) {
            if (selectedCardIndex === null) return;
            socket.emit('selectCardAndOfferer', { cardIndex: selectedCardIndex, offererId: targetSlot });
            selectedCardIndex = null;
        }

        function handleDropOnSlot(targetIndex) {
            if (!draggedSource) return;
            if (draggedSource.source === 'hand') {
                const gs = localState.gameState;
                if (gs.phase === 'CHOOSE_CARD_AND_OFFERER' && gs.activePlayer === mySlotId) {
                    selectedCardIndex = draggedSource.index;
                    render();
                } else if (gs.phase === 'LAYING_CARDS' && gs.layContext.playerId === mySlotId) {
                    socket.emit('attachCard', { handIndex: draggedSource.index, targetSlotIndex: targetIndex });
                }
            } else if (draggedSource.source === 'bank') {
                socket.emit('reorderBank', { fromIndex: draggedSource.index, toIndex: targetIndex });
            }
            draggedSource = null;
        }

        function createDropSlot(idx) {
            const slot = document.createElement('div');
            slot.className = 'drop-slot';
            slot.ondragover = (e) => { e.preventDefault(); slot.classList.add('drag-over'); };
            slot.ondragleave = () => slot.classList.remove('drag-over');
            slot.ondrop = (e) => { e.preventDefault(); slot.classList.remove('drag-over'); handleDropOnSlot(idx); };
            return slot;
        }

        function render() {
            if (!localState) return;

            const mapSlot = (slot) => (slot - mySlotId + 4) % 4;

            localState.players.forEach(p => {
                const mappedPos = mapSlot(p.id);
                const panel = document.getElementById(`p${mappedPos}`);

                if (!p.activeInGame) {
                    panel.classList.add('hidden');
                    return;
                }
                panel.classList.remove('hidden');

                if (mappedPos === 0) {
                    document.getElementById('p0-title').innerText = `${p.name} (VY)`;
                } else {
                    document.getElementById(`p${mappedPos}-title`).innerText = `${p.name} ${p.isBot ? '(Bot)' : ''}`;
                    document.getElementById(`p${mappedPos}-count`).innerText = p.cardCount;
                }
                document.getElementById(`p${mappedPos}-sets`).innerHTML = renderSetsHTML(p.sets);

                const gs = localState.gameState;
                if (gs) {
                    panel.classList.toggle('active', gs.offererPlayer === p.id || (gs.activePlayer === p.id && gs.phase === 'CHOOSE_CARD_AND_OFFERER'));
                }

                if (mappedPos !== 0 && gs && gs.phase === 'CHOOSE_CARD_AND_OFFERER' && gs.activePlayer === mySlotId && selectedCardIndex !== null) {
                    panel.style.cursor = 'pointer';
                    panel.onclick = () => chooseOfferer(p.id);
                } else if (mappedPos !== 0) {
                    panel.style.cursor = 'default';
                    panel.onclick = null;
                }
            });

            const myPlayer = localState.players[mySlotId];
            const handBox = document.getElementById('p0-hand');
            handBox.innerHTML = '';
            const gs = localState.gameState;

            myPlayer.hand.forEach((card, idx) => {
                const cDiv = document.createElement('div');
                cDiv.draggable = true;

                if (card.type === 'lichocar') {
                    cDiv.className = 'card lichocar';
                    cDiv.innerHTML = `😈`;
                } else {
                    cDiv.className = `card ${card.suit}`;
                    cDiv.innerHTML = `<div>${card.val}</div><div>${SUIT_ICONS[card.suit]}</div>`;
                }

                // Podmínky zvýrazňování karet na ruce
                let isLegitOffer = false;
                if (gs) {
                    if (gs.phase === 'CHOOSE_CARD_AND_OFFERER' && gs.activePlayer === mySlotId) {
                        isLegitOffer = true;
                    } else if (gs.phase === 'OFFERING' && gs.offererPlayer === mySlotId) {
                        // Zvýraznění platných nabídek (vyšší hodnota stejné barvy nebo Lichočár)
                        if (card.type === 'lichocar' || (card.suit === gs.targetSuit && card.val > gs.lastOfferValue)) {
                            isLegitOffer = true;
                        }
                    } else if (gs.phase === 'LAYING_CARDS' && gs.layContext.playerId === mySlotId) {
                        isLegitOffer = card.type !== 'lichocar';
                    }
                }

                if (isLegitOffer) {
                    cDiv.classList.add('highlighted');
                } else if (gs && (gs.phase === 'LAYING_CARDS' || gs.phase === 'OFFERING')) {
                    cDiv.classList.add('disabled');
                }

                if (selectedCardIndex === idx) cDiv.classList.add('selected');

                cDiv.onclick = () => selectCard(idx);
                cDiv.ondragstart = () => { draggedSource = { source: 'hand', index: idx }; };
                handBox.appendChild(cDiv);
            });

            const bankBox = document.getElementById('bank-cards');
            bankBox.innerHTML = '';

            if (!localState.started) {
                document.getElementById('bank-status').innerText = 'Čeká se na připojení všech živých hráčů...';
                return;
            }

            if (gs) {
                let displayCards = gs.phase === 'LAYING_CARDS' ? gs.layContext.cardsFromBank : gs.bank;
                
                if (gs.phase === 'LAYING_CARDS' && gs.layContext.playerId === mySlotId) {
                    bankBox.appendChild(createDropSlot(0));
                }

                displayCards.forEach((item, idx) => {
                    const card = item.card || item;
                    const cDiv = document.createElement('div');
                    cDiv.draggable = (gs.phase === 'LAYING_CARDS' && gs.layContext.playerId === mySlotId);

                    if (item.faceUp || gs.phase === 'LAYING_CARDS') {
                        if (card.type === 'lichocar') {
                            cDiv.className = 'card lichocar';
                            cDiv.innerHTML = `😈`;
                        } else {
                            cDiv.className = `card ${card.suit}`;
                            cDiv.innerHTML = `<div>${card.val}</div><div>${SUIT_ICONS[card.suit]}</div>`;
                        }
                        if (gs.phase === 'LAYING_CARDS') {
                            if (gs.validSetCardIndices && gs.validSetCardIndices[idx]) {
                                cDiv.classList.add('valid-set');
                            } else {
                                cDiv.classList.add('invalid-set');
                            }
                        }
                    } else {
                        cDiv.className = 'card back';
                        cDiv.innerText = '?';
                    }

                    cDiv.ondragstart = () => { draggedSource = { source: 'bank', index: idx }; };
                    bankBox.appendChild(cDiv);

                    if (gs.phase === 'LAYING_CARDS' && gs.layContext.playerId === mySlotId) {
                        bankBox.appendChild(createDropSlot(idx + 1));
                    }
                });

                const isMyDecision = gs.phase === 'DECISION' && gs.activePlayer === mySlotId;
                const isMyLaying = gs.phase === 'LAYING_CARDS' && gs.layContext.playerId === mySlotId;

                document.getElementById('btn-accept').disabled = !isMyDecision;
                document.getElementById('btn-more').disabled = !isMyDecision;
                document.getElementById('btn-reject').disabled = !isMyDecision;
                document.getElementById('btn-finish-lay').disabled = !isMyLaying;

                const statusBox = document.getElementById('bank-status');
                if (gs.phase === 'CHOOSE_CARD_AND_OFFERER' && gs.activePlayer === mySlotId) {
                    statusBox.innerText = selectedCardIndex !== null ? 'Nyní klikněte na protihráče!' : 'Vyberte kartu ze své ruky.';
                } else if (isMyDecision) {
                    statusBox.innerText = 'Vaše volba! Přijmete, odmítnete, nebo chcete ještě?';
                } else if (isMyLaying) {
                    statusBox.innerText = `Přikládání (${gs.layContext.attachedCount}/${gs.layContext.maxAttachCount}). Zeleně svítící karty tvoří platnou sadu.`;
                } else {
                    statusBox.innerText = `Na tahu je ${localState.players[gs.activePlayer].name}.`;
                }

                const logBox = document.getElementById('log-box');
                logBox.innerHTML = gs.logs.map(l => `> ${l}`).join('<br>');
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        function renderSetsHTML(sets) {
            if (!sets || sets.length === 0) return '<i>Žádné</i>';
            return sets.map(s => {
                let label = "";
                if (s.type === 'barva') label = `${SUIT_ICONS[s.cards[0].suit]} Barva (${s.cards.length})`;
                else if (s.type === 'cislo') label = `Stejné č. ${s.cards[0].val} (${s.cards.length})`;
                else if (s.type === 'postupka') label = `Postupka ${s.cards[0].val}-${s.cards[s.cards.length-1].val} (${s.cards.length})`;
                return `<span class="set-group">${label}</span>`;
            }).join(' ');
        }

        document.getElementById('btn-accept').onclick = () => socket.emit('playerDecision', { action: 'ACCEPT' });
        document.getElementById('btn-more').onclick = () => socket.emit('playerDecision', { action: 'MORE' });
        document.getElementById('btn-reject').onclick = () => socket.emit('playerDecision', { action: 'REJECT' });
        document.getElementById('btn-finish-lay').onclick = () => socket.emit('finishLaying');
    </script>
</body>
</html>
