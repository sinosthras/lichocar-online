<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lichočár Online</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; margin: 20px; }
        .setup-card { background: #2a2a2a; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .slot-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .card { display: inline-block; padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; background: #fff; color: #000; cursor: pointer; }
        .card.selected { border: 2px solid #ff0000; background: #ffe6e6; }
        .card.disabled { opacity: 0.4; cursor: not-allowed; }
        .card.cervena { color: red; }
        .card.zelena { color: green; }
        .card.zalud { color: brown; }
        .card.kula { color: orange; }
        .card-slot { display: inline-block; width: 60px; height: 80px; border: 1px dashed #666; margin: 5px; text-align: center; line-height: 80px; vertical-align: top; }
        .card-mini { display: inline-block; padding: 2px 5px; margin: 2px; border-radius: 3px; background: #fff; font-weight: bold; font-size: 0.8em; }
        .card-mini.cervena { color: red; }
        .card-mini.zelena { color: green; }
        .card-mini.zalud { color: brown; }
        .card-mini.kula { color: orange; }
        #game-board { display: flex; gap: 20px; margin-top: 20px; }
        #logs-panel { background: #111; padding: 10px; height: 200px; overflow-y: auto; width: 300px; font-family: monospace; font-size: 0.85em; }
        button { padding: 8px 12px; cursor: pointer; border: none; background: #007bff; color: white; border-radius: 4px; }
        button:hover { background: #0056b3; }
        select, input { padding: 6px; border-radius: 4px; border: 1px solid #555; background: #333; color: white; }
    </style>
</head>
<body>

    <h1>Lichočár Online</h1>

    <div id="lobby">
        <div class="setup-card">
            <h3>Připojení k místnosti</h3>
            <label>Kód místnosti: <input type="text" id="room-code" value="LOBBY1"></label><br><br>
            <label>Vaše jméno: <input type="text" id="player-name" value="Hráč 1"></label>
        </div>

        <div class="setup-card">
            <h3>Nastavení hráčů / botů v místnosti</h3>
            <div id="slot-configs">
                <div class="slot-row" data-slot="0">
                    <span>Slot 1:</span>
                    <select class="slot-type">
                        <option value="human" selected>Živý hráč (Vy)</option>
                    </select>
                </div>
                <div class="slot-row" data-slot="1">
                    <span>Slot 2:</span>
                    <select class="slot-type">
                        <option value="human">Živý hráč</option>
                        <option value="bot" selected>Bot</option>
                        <option value="inactive">Neaktivní</option>
                    </select>
                </div>
                <div class="slot-row" data-slot="2">
                    <span>Slot 3:</span>
                    <select class="slot-type">
                        <option value="human">Živý hráč</option>
                        <option value="bot" selected>Bot</option>
                        <option value="inactive">Neaktivní</option>
                    </select>
                </div>
                <div class="slot-row" data-slot="3">
                    <span>Slot 4:</span>
                    <select class="slot-type">
                        <option value="human">Živý hráč</option>
                        <option value="bot" selected>Bot</option>
                        <option value="inactive">Neaktivní</option>
                    </select>
                </div>
            </div>
        </div>

        <button id="btn-join">Vstoupit do hry / Spustit hra</button>
    </div>

    <div id="game-view" style="display: none;">
        <div id="players-overview" style="display: flex; gap: 15px; margin-bottom: 20px;">
            <div id="player-info-0" class="setup-card"></div>
            <div id="player-info-1" class="setup-card"></div>
            <div id="player-info-2" class="setup-card"></div>
            <div id="player-info-3" class="setup-card"></div>
        </div>

        <div class="setup-card">
            <h3>Bank na stolu</h3>
            <div id="bank-cards"></div>
        </div>

        <div class="setup-card">
            <h3>Akce</h3>
            <div id="action-controls"></div>
        </div>

        <div class="setup-card">
            <h3>Moje ruka</h3>
            <div id="my-hand"></div>
        </div>

        <div id="game-board">
            <div id="logs-panel">
                <h4>Herní protokol</h4>
                <div id="game-logs"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./main.js"></script>
</body>
</html>
